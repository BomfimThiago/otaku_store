<title>Minion Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#18100a;
    --sidebar:#150e08;
    --surface:#1F1710;
    --surface-2:#291F16;
    --line:#3A2E20;
    --ink:#F1E9DB;
    --muted:#9C8F79;
    --dim:#6C6252;

    --accent:#E2843F;       /* agent node / judgment */
    --accent-soft:#3D2A18;
    --verify:#4FB894;       /* deterministic node / pass */
    --verify-soft:#16302A;
    --judge:#9C93E8;        /* judge node / evaluation */
    --judge-soft:#28253F;
    --fail:#E2585A;
    --fail-soft:#3A1E1E;
    --pending:#544A3B;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
  }
  code, .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  .app{
    display:grid;
    grid-template-columns: 258px 1fr;
    min-height:100vh;
  }
  @media (max-width:760px){
    .app{ grid-template-columns: 1fr; }
  }

  /* ---------------- topbar ---------------- */
  .topbar{
    grid-column:1/-1;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--sidebar);
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:0.01em; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .brand small{ color:var(--dim); font-weight:400; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; }
  .topbar .stats{ display:flex; gap:22px; font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--muted); }
  .topbar .stats b{ color:var(--ink); font-weight:600; }
  @media (max-width:760px){ .topbar .stats{ display:none; } }

  /* ---------------- sidebar ---------------- */
  .sidebar{
    background:var(--sidebar);
    border-right:1px solid var(--line);
    padding:16px 12px;
    display:flex; flex-direction:column; gap:6px;
  }
  @media (max-width:760px){
    .sidebar{
      display:flex; flex-direction:row; overflow-x:auto;
      border-right:none; border-bottom:1px solid var(--line);
      padding:12px;
    }
  }
  .sidebar .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.1em;
    color:var(--dim); text-transform:uppercase; padding:4px 8px 8px;
  }
  @media (max-width:760px){ .sidebar .eyebrow{ display:none; } }

  .run-card{
    display:flex; flex-direction:column; gap:6px;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid transparent;
    cursor:pointer;
    min-width:200px;
    flex-shrink:0;
  }
  .run-card.active{ background:var(--surface); border-color:var(--line); }
  .run-card .repo{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--dim); }
  .run-card .task{ font-size:0.85rem; line-height:1.35; color:var(--ink); }
  .run-card .status{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; font-weight:600;
    padding:2px 0;
  }
  .run-card .status i{ width:6px; height:6px; border-radius:50%; }
  .status.running i{ background:var(--accent); animation:pulse 1.4s infinite; }
  .status.running{ color:var(--accent); }
  .status.done i{ background:var(--verify); }
  .status.done{ color:var(--verify); }
  .status.queued i{ background:var(--pending); }
  .status.queued{ color:var(--dim); }
  .status.blocked i{ background:var(--pending); border-radius:2px; }
  .status.blocked{ color:var(--dim); }
  .status.failed i{ background:var(--fail); }
  .status.failed{ color:var(--fail); }
  .status.escalated i{ background:var(--fail); border-radius:2px; }
  .status.escalated{ color:var(--fail); }
  .run-card .lockinfo{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:var(--dim);
    background:var(--surface-2); border-radius:5px; padding:3px 7px; margin-top:1px;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  /* ---------------- main ---------------- */
  main{ padding:22px 26px 44px; overflow-x:hidden; }
  .run-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .run-header h1{ font-size:1.15rem; font-weight:600; margin:0 0 5px; text-wrap:balance; }
  .run-header .meta{
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem; color:var(--dim);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .run-header .meta span b{ color:var(--muted); }

  .btnrow{ display:flex; gap:10px; }
  .btn{
    font-family:'IBM Plex Sans', sans-serif; font-size:0.82rem; font-weight:600;
    padding:8px 14px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); cursor:default;
  }
  .btn.primary{ background:var(--dim); color:var(--bg); border-color:var(--dim); opacity:0.45; }

  .statrow{
    display:flex; gap:22px; flex-wrap:wrap;
    padding:14px 16px; margin-bottom:26px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .n{ font-family:'IBM Plex Mono', monospace; font-size:1.02rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim); }
  .stat.warn .n{ color:var(--accent); }
  .stat.bad .n{ color:var(--fail); }

  /* ---------------- scheduler / lock panel ---------------- */
  .lockpanel{
    padding:12px 16px; margin-bottom:20px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
  }
  .lockpanel-head{
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--dim); font-weight:600;
    margin-bottom:8px;
  }
  .lockrow{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    font-size:0.82rem; padding:6px 0;
  }
  .lockrow .lf{ font-family:'IBM Plex Mono', monospace; color:var(--ink); background:var(--surface-2); padding:2px 7px; border-radius:5px; font-size:0.76rem; }
  .lockrow .lh{ color:var(--muted); }
  .lockrow .lh b{ color:var(--accent); font-weight:600; }
  .lockrow .lq{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--dim); }

  /* ---------------- section headers ---------------- */
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin:0 0 12px;
  }
  .sec-head h2{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim); font-weight:600; margin:0; }
  .type-legend{ display:flex; gap:14px; font-size:0.68rem; color:var(--dim); flex-wrap:wrap; }
  .type-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .type-legend i{ width:9px; height:9px; display:inline-block; border:2px solid; }
  .type-legend i.det{ border-color:var(--verify); border-radius:2px; }
  .type-legend i.agent{ border-color:var(--accent); border-radius:50%; }
  .type-legend i.judge{ border-color:var(--judge); border-radius:2px; transform:rotate(45deg); }

  /* ---------------- vertical pipeline ---------------- */
  .rail{ position:relative; padding-left:30px; margin-bottom:30px; }
  .rail::before{
    content:""; position:absolute; left:10px; top:6px; bottom:6px; width:2px; background:var(--line);
  }
  .rstep{ position:relative; margin-bottom:14px; }
  .rstep::before{
    content:""; position:absolute; left:-30px; top:14px; width:12px; height:12px; background:var(--bg); z-index:1;
    border:2px solid var(--pending);
  }
  .rstep.det::before{ border-radius:3px; }
  .rstep.agent::before{ border-radius:50%; }
  .rstep.judge::before{ border-radius:3px; transform:rotate(45deg); }

  .rstep.done::before{ border-color:var(--verify); background:var(--verify-soft); }
  .rstep.active::before{ border-color:var(--accent); background:var(--accent-soft); animation:ringv 1.4s infinite; }
  .rstep.failed::before{ border-color:var(--fail); background:var(--fail-soft); }
  .rstep.pending::before{ border-color:var(--pending); }
  @keyframes ringv{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft);} 50%{ box-shadow:0 0 0 5px var(--accent-soft);} }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:11px 14px;
  }
  .rstep.pending .card{ opacity:0.55; }
  .card-top{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:2px; }
  .step-name{ font-weight:600; font-size:0.88rem; }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:2px 6px; border-radius:4px; font-weight:600;
  }
  .badge.det{ background:var(--verify-soft); color:var(--verify); }
  .badge.agent{ background:var(--accent-soft); color:var(--accent); }
  .badge.judge{ background:var(--judge-soft); color:var(--judge); }
  .badge.model{ background:var(--surface-2); color:var(--muted); text-transform:none; letter-spacing:0; }
  .badge.cond{ background:var(--surface-2); color:var(--dim); text-transform:none; letter-spacing:0; font-style:italic; }

  .card-status{
    margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; font-weight:600; white-space:nowrap;
  }
  .rstep.done .card-status{ color:var(--verify); }
  .rstep.active .card-status{ color:var(--accent); }
  .rstep.failed .card-status{ color:var(--fail); }
  .rstep.pending .card-status{ color:var(--dim); }

  .card-sub{ font-size:0.78rem; color:var(--muted); margin-top:3px; }
  .card-sub b{ color:var(--ink); font-weight:600; }

  /* parallel sub-row */
  .parallel-row{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .parallel-item{
    flex:1; min-width:200px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:8px 10px;
  }
  .parallel-item .pt{ font-size:0.78rem; font-weight:600; margin-bottom:2px; }
  .parallel-item .ps{ font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:var(--verify); }
  .parallel-tag{
    display:inline-block; margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size:0.64rem;
    color:var(--dim); letter-spacing:0.04em;
  }

  /* loop-back banner */
  .loopback{
    position:relative; margin:-2px 0 14px 0;
    border:1px dashed var(--fail); border-radius:8px;
    background:var(--fail-soft); color:#F0B7B7;
    padding:9px 14px; font-size:0.8rem; display:flex; gap:9px; align-items:flex-start;
  }
  .loopback .ic{ font-family:'IBM Plex Mono', monospace; font-weight:700; }
  .loopback b{ color:#fff; }

  /* ---------------- panels ---------------- */
  .panels{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:900px){ .panels{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line);
    font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--dim); font-weight:600;
  }
  .panel-head .live{ display:flex; align-items:center; gap:6px; color:var(--accent); text-transform:none; letter-spacing:0; font-family:'IBM Plex Mono', monospace; }
  .panel-head .live i{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.4s infinite; }
  .panel-head .tag{ text-transform:none; letter-spacing:0; font-family:'IBM Plex Mono', monospace; color:var(--fail); }

  .log{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; line-height:1.75;
    padding:14px; max-height:280px; overflow-y:auto;
  }
  .log .t{ color:var(--dim); margin-right:8px; }
  .log .who{ color:var(--accent); }
  .log .jg{ color:var(--judge); }
  .log .ok{ color:var(--verify); }
  .log .bad{ color:var(--fail); }
  .log .cur::after{ content:"▌"; animation:pulse 1s infinite; color:var(--accent); }

  /* judge verdict panel */
  .verdict{ padding:14px; }
  .vscore{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .vscore .num{ font-family:'IBM Plex Mono', monospace; font-size:1.6rem; font-weight:700; color:var(--fail); font-variant-numeric:tabular-nums; }
  .vscore .of{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--dim); }
  .vscore .verdict-tag{
    margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.66rem; text-transform:uppercase;
    background:var(--fail-soft); color:var(--fail); padding:3px 8px; border-radius:5px; font-weight:700;
  }
  .vscore.approved .num{ color:var(--verify); }
  .vscore.approved .verdict-tag{ background:var(--verify-soft); color:var(--verify); }
  .checklist{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .cl-item{ display:flex; gap:8px; font-size:0.8rem; align-items:flex-start; }
  .cl-item .m{ font-weight:700; font-family:'IBM Plex Mono', monospace; }
  .cl-item.pass .m{ color:var(--verify); }
  .cl-item.fail .m{ color:var(--fail); }
  .critique{
    font-size:0.8rem; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; line-height:1.5;
  }
  .critique b{ color:var(--ink); }

  .diffpanel .diff{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; line-height:1.7; }
  .diffpanel .file{ padding:9px 14px; color:var(--muted); border-bottom:1px solid var(--line); font-size:0.74rem; }
  .diffpanel pre{ margin:0; padding:12px 14px; overflow-x:auto; white-space:pre; }
  .diffpanel .rm{ background:var(--fail-soft); color:#F0B7B7; display:block; }
  .diffpanel .ad{ background:var(--verify-soft); color:#BFE9DA; display:block; }
  .diffpanel .ctx{ color:var(--dim); display:block; }

  footer.note{ margin-top:22px; font-size:0.78rem; color:var(--dim); font-style:italic; }
  .empty{ padding:60px 20px; text-align:center; color:var(--dim); }
  .empty code{ color:var(--accent); }

  .trigger{ margin-bottom:22px; }
  .trigger label{ display:block; font-size:0.8rem; color:var(--dim); margin-bottom:8px; }
  .trigger-row{ display:flex; align-items:center; gap:6px; }
  .trigger-row .hash{ color:var(--accent); font-weight:700; }
  .trigger input{ flex:1; min-width:0; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14);
    color:inherit; border-radius:8px; padding:8px 10px; font:inherit; }
  .trigger input:focus{ outline:none; border-color:var(--accent); }
  .trigger button{ background:var(--accent); color:#04121a; border:0; border-radius:8px; padding:8px 14px;
    font:inherit; font-weight:700; cursor:pointer; white-space:nowrap; }
  .trigger button:disabled{ opacity:0.5; cursor:default; }
  .trigger-msg{ margin-top:8px; font-size:0.78rem; min-height:1em; color:var(--dim); }
  .trigger-msg.ok{ color:var(--accent); }
  .trigger-msg.err{ color:#ff6b81; }
  .killbtn{ margin-top:8px; width:100%; background:transparent; color:#ff6b81; border:1px solid #ff6b81;
    border-radius:8px; padding:7px 10px; font:inherit; font-weight:600; cursor:pointer; }
  .killbtn:hover{ background:rgba(255,107,129,0.12); }
  .killbtn:disabled{ opacity:0.5; cursor:default; }

  .parwrap{ margin-top:9px; }
  .parhint{ font-size:0.66rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  .parlanes{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .parlane{ display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid rgba(255,255,255,0.10);
    border-radius:8px; background:rgba(255,255,255,0.03); }
  .parlane .pl-ico{ font-size:0.95rem; line-height:1; }
  .parlane .pl-txt{ display:flex; flex-direction:column; line-height:1.2; flex:1; min-width:0; }
  .parlane .pl-txt b{ font-size:0.8rem; font-weight:600; }
  .parlane .pl-txt em{ font-size:0.68rem; color:var(--dim); font-style:normal; }
  .parlane .pl-tag{ font-size:0.66rem; color:var(--dim); white-space:nowrap; }
  .parlane.run{ border-color:var(--accent); background:rgba(34,228,255,0.06); }
  .parlane.run .pl-ico, .parlane.run .pl-tag{ color:var(--accent); }
  .parlane.run .pl-ico{ animation:parpulse 1s ease-in-out infinite; }
  .parlane.ok .pl-ico{ color:#39d98a; }
  .parlane.ok .pl-tag{ color:#39d98a; }
  .parlane.pending{ opacity:0.5; }
  @keyframes parpulse{ 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>minion console <small>local · live</small></div>
    <div class="stats" id="topstats"></div>
  </div>

  <aside class="sidebar">
    <div class="eyebrow" id="trigger-eyebrow">Pedir ao Minion</div>
    <form id="triggerform" class="trigger">
      <label for="issueinput">Implementar uma issue do GitHub</label>
      <div class="trigger-row">
        <span class="hash">#</span>
        <input id="issueinput" type="number" min="1" step="1" placeholder="nº da issue" inputmode="numeric" />
        <button id="triggerbtn" type="submit">Rodar</button>
      </div>
      <div id="triggermsg" class="trigger-msg"></div>
      <button id="killbtn" type="button" class="killbtn" hidden>■ Parar run atual</button>
    </form>

    <div class="eyebrow">Runs</div>
    <div id="runlist"></div>
  </aside>

  <main id="main">
    <div class="empty">nenhum run ainda — rode <code>minion run "…"</code> em outro terminal</div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const TIER_LABEL = { strong: "modelo forte", fast: "modelo rápido" };
  const RUN_STATUS_LABEL = {
    running: "em execução", done: "pronto p/ revisão", queued: "na fila",
    blocked: "bloqueado por lock", failed: "falhou", escalated: "escalado p/ humano",
  };
  const STEP_CLASS = { done: "done", active: "active", failed: "failed", skipped: "pending", pending: "pending" };

  let blueprint = [];              // [{node, type, label, tier, conditional, loops}]
  let runs = [];                   // newest first
  let selectedId = null;
  let logCache = [];               // log for the selected run

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const fmtClock = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? "" : d.toTimeString().slice(0, 8);
  };
  const fmtElapsed = (run) => {
    if (!run.startedAt) return "—";
    const end = run.finishedAt ? new Date(run.finishedAt) : new Date();
    const ms = end - new Date(run.startedAt);
    if (!Number.isFinite(ms) || ms < 0) return "—";
    const s = Math.floor(ms / 1000);
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };
  const stepDur = (step) => {
    if (!step.startedAt || !step.finishedAt) return "";
    const ms = new Date(step.finishedAt) - new Date(step.startedAt);
    return Number.isFinite(ms) && ms >= 0 ? ` ${(ms / 1000).toFixed(1)}s` : "";
  };

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`${url} → ${r.status}`);
    return r.json();
  }

  // ---------------- rendering ----------------

  function renderTopStats() {
    const active = runs.filter((r) => r.status === "running").length;
    const blocked = runs.filter((r) => r.status === "blocked").length;
    const done = runs.filter((r) => r.status === "done").length;
    document.getElementById("topstats").innerHTML =
      `<span>runs ativos <b>${active}</b></span>` +
      `<span>bloqueados <b>${blocked}</b></span>` +
      `<span>concluídos <b>${done}</b></span>`;
  }

  function renderSidebar() {
    const list = document.getElementById("runlist");
    if (runs.length === 0) { list.innerHTML = ""; return; }
    list.innerHTML = runs.map((r) => {
      const st = RUN_STATUS_LABEL[r.status] ?? r.status;
      const lock = r.status === "blocked" && r.lockedFiles && r.lockedFiles.length
        ? `<div class="lockinfo">aguardando ${esc(r.lockedFiles[0])}</div>` : "";
      return `<div class="run-card ${r.id === selectedId ? "active" : ""}" data-id="${esc(r.id)}">
        <div class="repo">${esc(r.repo?.name ?? "repo")}</div>
        <div class="task">${esc(r.workItem)}</div>
        <div class="status ${esc(r.status)}"><i></i>${esc(st)}</div>
        ${lock}
      </div>`;
    }).join("");
    list.querySelectorAll(".run-card").forEach((el) => {
      el.addEventListener("click", () => { selectedId = el.dataset.id; refreshSelected(true); });
    });
  }

  function railCard(spec, step) {
    const status = step ? (STEP_CLASS[step.status] ?? "pending") : "pending";
    const badges = [`<span class="badge ${spec.type}">${spec.type === "det" ? "det" : spec.type}</span>`];
    if (spec.tier) badges.push(`<span class="badge model">${TIER_LABEL[spec.tier] ?? spec.tier}</span>`);
    if (spec.conditional) badges.push(`<span class="badge cond">condicional · só se tocar frontend</span>`);

    let statusText = "—";
    if (step) {
      if (step.status === "done") statusText = `✓${stepDur(step)}`;
      else if (step.status === "active") statusText = step.attempt ? `tentativa ${step.attempt}/${step.maxAttempts ?? 2} · rodando…` : "rodando…";
      else if (step.status === "failed") statusText = "✗";
      else if (step.status === "skipped") statusText = "pulado";
    }
    const sub = step && step.summary
      ? `<div class="card-sub">${esc(step.summary)}</div>`
      : (step && step.skippedReason ? `<div class="card-sub">${esc(step.skippedReason)}</div>` : "");

    const parallel = spec.node === "context" ? parallelLanes(step) : "";

    return `<div class="rstep ${spec.type} ${status}">
      <div class="card">
        <div class="card-top">
          <span class="step-name">${esc(spec.label)}</span>
          ${badges.join("")}
          <span class="card-status">${statusText}</span>
        </div>
        ${sub}
        ${parallel}
      </div>
    </div>`;
  }

  // The context node runs two agents in parallel (Promise.all): internal RAG +
  // official sources. Surface both lanes so the parallelism is visible.
  function parallelLanes(step) {
    const st = step ? step.status : "pending";
    let ico = "○", cls = "pending", tag = "aguardando";
    if (st === "active") { ico = "◐"; cls = "run"; tag = "rodando…"; }
    else if (st === "done") { ico = "✓"; cls = "ok"; tag = "pronto"; }
    const lane = (title, subtitle) =>
      `<div class="parlane ${cls}"><span class="pl-ico">${ico}</span>` +
      `<span class="pl-txt"><b>${title}</b><em>${subtitle}</em></span>` +
      `<span class="pl-tag">${tag}</span></div>`;
    return `<div class="parwrap"><div class="parhint">2 pipelines em paralelo</div>` +
      `<div class="parlanes">` +
      lane("Busca interna", "código + RAG do repo") +
      lane("Docs oficiais", "Tavily · Context7") +
      `</div></div>`;
  }

  function renderMain(run) {
    const stepByNode = new Map((run.steps ?? []).map((s) => [s.node, s]));
    const doneCount = (run.steps ?? []).filter((s) => s.status === "done").length;
    const rejections = (run.verdicts ?? []).filter((v) => v.verdict === "rejected").length;
    const lastRejected = [...(run.verdicts ?? [])].reverse().find((v) => v.verdict === "rejected");
    const lastVerdict = (run.verdicts ?? [])[run.verdicts.length - 1];

    const rail = blueprint.map((spec) => railCard(spec, stepByNode.get(spec.node))).join("");

    const locks = (run.lockedFiles ?? []).length
      ? run.lockedFiles.map((f) => `<div class="lockrow">
            <span class="lf">${esc(f)}</span>
            <span class="lh">preso por <b>este run</b></span>
          </div>`).join("")
      : `<div class="lockrow"><span class="lh">sem locks (o plano ainda não fixou arquivos)</span></div>`;

    const loop = lastRejected ? `<div class="loopback">
        <span class="ic">↩</span>
        <span><b>Reprovado</b> pelo Judge de ${lastRejected.judge === "plan" ? "plano" : "implementação"} (score ${lastRejected.score}/100) — corrigindo com o feedback antes de seguir.</span>
      </div>` : "";

    const verdictPanel = lastVerdict ? `<div class="panel">
        <div class="panel-head">judge · ${lastVerdict.judge === "plan" ? "plano" : "implementação"} <span class="tag">${lastVerdict.verdict}</span></div>
        <div class="verdict">
          <div class="vscore ${lastVerdict.verdict === "approved" ? "approved" : ""}">
            <span class="num">${lastVerdict.score}</span><span class="of">/ 100</span>
            <span class="verdict-tag">${lastVerdict.verdict}</span>
          </div>
          <div class="checklist">
            ${(lastVerdict.checklist ?? []).map((c) => `<div class="cl-item ${c.passed ? "pass" : "fail"}"><span class="m">${c.passed ? "✓" : "✕"}</span><span>${esc(c.label)}</span></div>`).join("")}
          </div>
          ${lastVerdict.critique ? `<div class="critique"><b>Crítica:</b> ${esc(lastVerdict.critique)}</div>` : ""}
        </div>
      </div>` : "";

    const live = run.status === "running" ? `<span class="live"><i></i>ao vivo</span>` : "";
    const logRows = logCache.map((e) => {
      const who = e.actor === "judge" ? "jg" : "who";
      const lvl = e.level === "error" ? "bad" : e.level === "ok" ? "ok" : "";
      const whoLabel = e.actor === "judge" ? "judge&gt;" : e.actor === "agent" ? "agent&gt;" : "sys&gt;";
      return `<div><span class="t">${fmtClock(e.ts)}</span><span class="${who}">${whoLabel}</span> <span class="${lvl}">${esc(e.message)}</span></div>`;
    }).join("");

    document.getElementById("main").innerHTML = `
      <div class="run-header">
        <div>
          <h1>${esc(run.workItem)}</h1>
          <div class="meta">
            <span>repo <b>${esc(run.repo?.name ?? "")}</b></span>
            ${run.branch ? `<span>branch <b>${esc(run.branch)}</b></span>` : ""}
            ${run.startedAt ? `<span>iniciado às <b>${fmtClock(run.startedAt)}</b></span>` : ""}
          </div>
        </div>
        <div class="btnrow"><button class="btn">ver clone</button><button class="btn primary">aprovar diff</button></div>
      </div>

      <div class="statrow">
        <div class="stat ${run.status === "running" ? "warn" : ""}"><span class="n">${fmtElapsed(run)}</span><span class="l">tempo decorrido</span></div>
        <div class="stat ${rejections ? "bad" : ""}"><span class="n">${rejections}/${blueprint.length ? 2 : 2}</span><span class="l">reprovações do judge</span></div>
        <div class="stat"><span class="n">${doneCount}/${blueprint.length}</span><span class="l">nós concluídos</span></div>
        <div class="stat"><span class="n">${esc(RUN_STATUS_LABEL[run.status] ?? run.status)}</span><span class="l">estado</span></div>
      </div>

      <div class="lockpanel">
        <div class="lockpanel-head">Agendador · locks ativos</div>
        ${locks}
      </div>

      <div class="sec-head">
        <h2>Blueprint do run</h2>
        <div class="type-legend">
          <span><i class="det"></i>determinístico</span>
          <span><i class="agent"></i>agente</span>
          <span><i class="judge"></i>judge</span>
        </div>
      </div>

      <div class="rail">${rail}</div>
      ${loop}

      <div class="panels">
        <div class="panel">
          <div class="panel-head">log de execução ${live}</div>
          <div class="log">${logRows || '<div class="t">sem eventos ainda</div>'}</div>
        </div>
        ${verdictPanel}
      </div>

      <footer class="note">Dados reais — lidos de minion/runs/run-${esc(run.id)}.json ao vivo.</footer>
    `;
  }

  // ---------------- polling ----------------

  async function refreshSelected(force) {
    const run = runs.find((r) => r.id === selectedId);
    if (!run) return;
    try { logCache = (await getJson(`/api/runs/${run.id}/log`)).log ?? []; } catch { logCache = []; }
    renderMain(run);
  }

  async function tick() {
    try {
      runs = (await getJson("/api/runs")).runs ?? [];
    } catch { runs = []; }

    if (runs.length && (!selectedId || !runs.some((r) => r.id === selectedId))) {
      selectedId = runs[0].id;
    }
    renderTopStats();
    renderSidebar();
    const kb = document.getElementById("killbtn");
    if (kb) kb.hidden = !runs.some((r) => r.status === "running");
    if (selectedId) await refreshSelected();
    else document.getElementById("main").innerHTML =
      '<div class="empty">nenhum run ainda — rode <code>minion run "…"</code> em outro terminal</div>';
  }

  function wireTrigger() {
    const form = document.getElementById("triggerform");
    const input = document.getElementById("issueinput");
    const btn = document.getElementById("triggerbtn");
    const msg = document.getElementById("triggermsg");
    if (!form) return;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const issue = Number(input.value);
      if (!Number.isInteger(issue) || issue <= 0) {
        msg.className = "trigger-msg err"; msg.textContent = "digite um número de issue válido";
        return;
      }
      btn.disabled = true; msg.className = "trigger-msg"; msg.textContent = "iniciando…";
      try {
        const r = await fetch("/api/trigger", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ issue, token: new URLSearchParams(location.search).get("token") || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          msg.className = "trigger-msg ok";
          msg.textContent = data.message || `Minion iniciado na issue #${issue}`;
          input.value = "";
          await tick();
        } else {
          msg.className = "trigger-msg err";
          msg.textContent = data.error || `erro (${r.status})`;
        }
      } catch (err) {
        msg.className = "trigger-msg err"; msg.textContent = "falha de rede";
      } finally {
        btn.disabled = false;
      }
    });

    const killbtn = document.getElementById("killbtn");
    killbtn?.addEventListener("click", async () => {
      killbtn.disabled = true;
      try {
        const r = await fetch("/api/kill", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token: new URLSearchParams(location.search).get("token") || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        msg.className = r.ok ? "trigger-msg" : "trigger-msg err";
        msg.textContent = data.message || data.error || "";
        await tick();
      } catch {
        msg.className = "trigger-msg err"; msg.textContent = "falha de rede";
      } finally {
        killbtn.disabled = false;
      }
    });
  }

  async function boot() {
    try { blueprint = (await getJson("/api/blueprint")).nodes ?? []; } catch { blueprint = []; }
    let cfg = { trigger: true };
    try { cfg = await getJson("/api/config"); } catch { /* older server — assume on */ }
    if (cfg.trigger) {
      wireTrigger();
    } else {
      // read-only deploy: hide the trigger panel so nobody hits a disabled endpoint
      document.getElementById("triggerform")?.remove();
      document.getElementById("trigger-eyebrow")?.remove();
    }
    await tick();
    setInterval(tick, 1000);
  }

  boot();
})();
</script>
